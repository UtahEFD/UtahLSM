[build-system]
# Specify how to build the package
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Basic project metadata
name = "utahlsm"
version = "0.1.0"
description = "Utah Land-Surface Model (UtahLSM) - A fast-response land-surface model for simulating heat, moisture, and momentum exchange between land and atmosphere"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jeremy A. Gibbs", email = "jeremy.gibbs@noaa.gov"},
    {name = "Rob Stoll", email = "rob.stoll@utah.edu"},
    {name = "Eric Pardyjak", email = "pardyjak@utah.edu"},
    {name = "Pete Willemsen", email = "willemsen@ucar.edu"},
]
keywords = ["land-surface-model", "weather", "climate", "simulation", "atmospheric"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Physics",
]

# Core dependencies required to run UtahLSM
dependencies = [
    "numpy>=1.20.0",
    "netCDF4>=1.5.0",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

# Optional dependencies for analysis and documentation
analysis = [
    "matplotlib>=3.5",
    "xarray>=2022.0",
]

docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "mkdocs-mermaid2-plugin>=1.1",
]

[project.urls]
Homepage = "https://github.com/UtahEFD/UtahLSM"
Repository = "https://github.com/UtahEFD/UtahLSM.git"
Documentation = "https://utahefd.github.io/UtahLSM/"
"Bug Tracker" = "https://github.com/UtahEFD/UtahLSM/issues"

# ============================================================================
# Tool Configuration
# ============================================================================

[tool.setuptools]
# Tell setuptools where to find the package
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["utahlsm*"]

[tool.setuptools.package-data]
utahlsm = [
    "py.typed",
    "data/soil/*.json",
    "util/io/*.json",
]

[tool.pytest.ini_options]
minversion = "6.0"

# Test discovery
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Test paths
testpaths = ["tests"]

# Output options
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
]

# Custom markers for organizing tests
markers = [
    "solver: Tests for numerical solvers (tridiagonal, root_brent)",
    "soil: Tests for soil physics models",
    "seb: Tests for surface energy budget solver",
    "smb: Tests for surface moisture budget solver",
    "precip: Tests for liquid precipitation forcing and runoff diagnostic",
    "canopy: Tests for canopy / vegetation physics",
    "datamodel: Tests for configuration and state dataclasses",
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.ruff]
# Code quality and linting configuration
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific rules
    "D",    # pydocstyle (Google convention; types live in PEP 484 hints, not docstrings)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E741",   # ambiguous variable names (sometimes necessary in math)
    "N",      # naming conventions (pep8-naming is often too strict for scientific code)
    "RUF003", # Ambiguous character in comments (EN DASH vs HYPHEN)
    "RUF012", # Mutable class attributes (false positives in dataclasses)
    "RUF013", # Implicit Optional (can be overly strict)
    "RUF059", # Unpacked but unused (sometimes intentional in patterns)
    "D203",   # 1 blank line before class docstring (conflicts with D211)
    "D213",   # Multi-line summary on second line (conflicts with D212)
]

[tool.ruff.lint.pydocstyle]
# Use Google docstring convention. Types are documented via PEP 484 hints, so
# Args entries should be `name: description` (no parenthesized type).
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]  # Package exports; package docstring not required
"tests/*" = ["F841", "E731", "RUF013", "D"]  # Lambdas/unused vars common in tests; skip docstring rules
"tests/conftest.py" = ["E731", "RUF013", "D"]  # Lambda assignments in fixtures are acceptable, Optional defaults
"utahlsm_offline.py" = ["D100"]  # Script entry point

[tool.pyright]
# matplotlib stubs use **kwargs: Unknown pervasively; suppress the noise.
reportUnknownMemberType = "none"

[tool.mypy]
# Static type checking configuration
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "netCDF4.*"
ignore_missing_imports = true

[tool.isort]
# Import sorting configuration
profile = "black"
line_length = 88
skip_gitignore = true
known_first_party = ["utahlsm"]
known_third_party = ["numpy", "netCDF4"]

[tool.black]
# Code formatter configuration (if using black)
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
