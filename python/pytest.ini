[pytest]
# Pytest configuration for UtahLSM testing suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Minimum Python version
minversion = 6.0

# Add current directory to path for imports
pythonpath = .

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    ; --disable-warnings

# Custom markers for test organization
markers =
    solver: Tests for numerical solvers (tridiagonal, root_brent)
    soil: Tests for soil physics models
    seb: Tests for surface energy budget
    smb: Tests for surface moisture budget
    datamodel: Tests for configuration and state dataclasses
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
